name: Alpha Release

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Dev

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep "mod_version=" gradle.properties | cut -d'=' -f2)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Generate new alpha version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"

          # Check if version already contains alpha suffix
          if [[ "$CURRENT_VERSION" =~ ^(.+)-a([0-9]+)$ ]]; then
            # Version has alpha suffix, increment alpha number
            BASE_VERSION="${BASH_REMATCH[1]}"
            ALPHA_NUM="${BASH_REMATCH[2]}"
            NEW_ALPHA_NUM=$((ALPHA_NUM + 1))
            NEW_VERSION="${BASE_VERSION}-a${NEW_ALPHA_NUM}"
          else
            # Version doesn't have alpha suffix, add a1
            NEW_VERSION="${CURRENT_VERSION}-a1"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION"

      - name: Update version in gradle.properties
        run: |
          sed -i "s/mod_version=${{ steps.current_version.outputs.current_version }}/mod_version=${{ steps.new_version.outputs.new_version }}/" gradle.properties
          echo "Updated gradle.properties with new version: ${{ steps.new_version.outputs.new_version }}"

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gradle.properties
          git commit -m "Bump version to ${{ steps.new_version.outputs.new_version }} for alpha release [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - name: Build with Gradle
        run: ./gradlew :fabric:build -x test --no-daemon

      - name: Find built JARs
        id: find_jars
        run: |
          TATERZENS_JAR=$(find fabric/build/libs -name "taterzens-fabric-*.jar" \
            ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" \
            ! -name "*-shadow.jar" | head -n 1)

          if [ -z "$TATERZENS_JAR" ]; then
            echo "No Taterzens JAR found!"
            ls -la fabric/build/libs/
            exit 1
          fi
          echo "taterzens_jar=$TATERZENS_JAR" >> $GITHUB_OUTPUT
          echo "jar_list=${TATERZENS_JAR}" >> $GITHUB_OUTPUT
          echo "Found Taterzens JAR: $TATERZENS_JAR"

      - name: Install LFTP
        run: sudo apt-get install -y lftp

      - name: Add Server Key
        env:
          FTP_HOST_SECRET: ${{ secrets.FTP_DEV_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Clean the host variable: strip sftp://, ftp://, and potential port numbers
          CLEAN_HOST=$(echo "$FTP_HOST_SECRET" | sed -E 's#^[a-z]+://##' | cut -d':' -f1)
          echo "Scanning host: $CLEAN_HOST"
          ssh-keyscan -p 2022 "$CLEAN_HOST" >> ~/.ssh/known_hosts

      - name: Upload to FTP (Dev)
        env:
          FTP_HOST_SECRET: ${{ secrets.FTP_DEV_HOST }}
          FTP_USER: ${{ secrets.FTP_DEV_USER }}
          FTP_PASS: ${{ secrets.FTP_DEV_PASSWORD }}
          TATERZENS_JAR: ${{ steps.find_jars.outputs.taterzens_jar }}
        run: |
          # Clean the host variable again for use in lftp
          CLEAN_HOST=$(echo "$FTP_HOST_SECRET" | sed -E 's#^[a-z]+://##' | cut -d':' -f1)

          # Connecting to SFTP on port 2022
          lftp -e "set net:timeout 20; set ssl:verify-certificate false; set sftp:auto-confirm yes; open sftp://$CLEAN_HOST:2022; user $FTP_USER $FTP_PASS; cd /mods; set cmd:fail-exit no; mrm taterzens-fabric-*.jar; set cmd:fail-exit yes; put -O . $TATERZENS_JAR; bye"

      - name: Post Alpha to Discord
        uses: appleboy/discord-action@master
        with:
          webhook_id: "1473729789834825850"
          webhook_token: "J01kl-WXTTe1kV7gSLoneQSoC_fkq0t8s58XcCklqTF8xGQnlIDBkZi3Mc4LQ5jzkC9m"
          message: |
            **Updated Taterzens to :** `${{ steps.new_version.outputs.new_version }}`

          file: ${{ steps.find_jars.outputs.jar_list }}
